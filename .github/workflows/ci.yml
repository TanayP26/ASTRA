name: ASTRA CI

on:
  push:
    branches: [main, nationals-hardening]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Python dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Run Ruff
        run: uv run ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "FrontEnd 2.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "FrontEnd 2.0/package-lock.json"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build FrontEnd 2.0
        run: npm run build
