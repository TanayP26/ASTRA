name: ASTRA CI

on:
  push:
    branches: [main, nationals-hardening]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Python dependencies
        run: uv sync --extra dev
      - name: Run deterministic test suite
        run: >
          uv run pytest
          -k "not test_orbit_websocket and not test_v1_global_catalog_and_summary and not test_v1_global_states_and_fleet"
      - name: Run Ruff
        run: uv run ruff check .

  public-source-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Python dependencies
        run: uv sync --extra dev
      - name: Exercise network-dependent CelesTrak paths when the provider is reachable
        run: >
          uv run pytest tests/test_backend_api.py
          -k "test_orbit_websocket or test_v1_global_catalog_and_summary or test_v1_global_states_and_fleet"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "FrontEnd 2.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "FrontEnd 2.0/package-lock.json"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build FrontEnd 2.0
        run: npm run build

  deployment-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend deployment image
        run: docker build -t astra-backend .
      - name: Build frontend deployment image
        run: docker build -t astra-frontend "FrontEnd 2.0"
