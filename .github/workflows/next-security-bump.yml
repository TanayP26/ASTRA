name: Next.js security bump

on:
  push:
    branches: [security-next-15-5-24]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-next-15-5-24
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "FrontEnd 2.0/package-lock.json"
      - name: Upgrade supported patched Next.js
        working-directory: "FrontEnd 2.0"
        run: npm install next@16.3.5 --save-exact
      - name: Audit production dependencies
        working-directory: "FrontEnd 2.0"
        run: npm audit --omit=dev
      - name: Build frontend
        working-directory: "FrontEnd 2.0"
        run: npm run build
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- "FrontEnd 2.0/package.json" "FrontEnd 2.0/package-lock.json"; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "FrontEnd 2.0/package.json" "FrontEnd 2.0/package-lock.json"
          git commit -m "fix(frontend): upgrade Next.js to patched 16.3.5 [skip ci]"
          git push origin HEAD:security-next-15-5-24
